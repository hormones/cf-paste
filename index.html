<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paste</title>
    <style>
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #app-loading.fade-out { opacity: 0; }
      @media (prefers-color-scheme: dark) {
        #app-loading { background: #000; }
        #app-loading .spinner { border-color: #30363d; border-top-color: #58a6ff; }
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #eaeef2;
        border-top-color: #0969da;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app-loading"><div class="spinner"></div></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
